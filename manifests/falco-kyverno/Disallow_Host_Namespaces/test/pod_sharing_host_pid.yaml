apiVersion: v1
kind: Pod
metadata:
  name: test-host-sharing
  labels:
    app.kubernetes.io/name: test-host-sharing
spec:
  containers:
  - name: test-host-sharing
    image: <Image>
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"
  hostPID: true
  hostIPC: true
  hostNetwork: true
  volumes:
  - name: host-root
    hostPath:
      path: /
