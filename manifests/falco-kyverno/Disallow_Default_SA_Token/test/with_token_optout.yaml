apiVersion: v1
kind: Pod
metadata:
  name: test-default-sa-pass
  namespace: default
spec:
  automountServiceAccountToken: false
  containers:
    - name: app
      image: nginx:latest
      resources:
        requests:
          cpu: "50m"
          memory: "64Mi"
        limits:
          cpu: "100m"
          memory: "128Mi"
