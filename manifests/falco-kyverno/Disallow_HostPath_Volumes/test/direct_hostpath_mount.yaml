apiVersion: v1
kind: Pod
metadata:
  name: test-hostpath-mount
spec:
  containers:
  - name: app
    image: nginx:1.25
    volumeMounts:
    - mountPath: /host-etc
      name: host-val
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "100m"
        memory: "128Mi"
  volumes:
  - hostPath:
      path: /etc
      type: Directory
    name: host-val
